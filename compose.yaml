services:
  ollama:
    image: ollama/ollama:0.12.6
    # Runs on the CPU by default; add compose.gpu.yaml for an NVIDIA GPU (see .env.example).
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  yocode:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    stdin_open: true
    tty: true
    environment:
      # Point at a native Ollama instead, e.g. http://host.docker.internal:11434 on a Mac (Metal GPU).
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      PROJECT_HOST_PATH: ${PROJECT_PATH:?set PROJECT_PATH in .env}
      DOCS_HOST_PATH: ${DOCS_PATH:-}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3.5:9b-q4_K_M}
      NUM_CTX: ${NUM_CTX:-16384}
      THINK: ${THINK:-false}
      SEED: ${SEED:-42}
      TASK_MODE: ${TASK_MODE:-subagents}
      GIT_AUTHOR_NAME: ${GIT_USER_NAME:-yocode}
      GIT_COMMITTER_NAME: ${GIT_USER_NAME:-yocode}
      GIT_AUTHOR_EMAIL: ${GIT_USER_EMAIL:-yocode@localhost}
      GIT_COMMITTER_EMAIL: ${GIT_USER_EMAIL:-yocode@localhost}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      REINDEX: ${REINDEX:-false}
      REVIEW_LANGUAGE: ${REVIEW_LANGUAGE:-English}
      REVIEW_MAX_FILES: ${REVIEW_MAX_FILES:-25}
    volumes:
      - ${PROJECT_PATH:?set PROJECT_PATH in .env}:/project
      - ${DOCS_PATH:-./.nodocs}:/docs:ro
      - yocode-data:/data

  # Integration tests on a fixture repo against the ollama service: docker compose run --rm itest
  itest:
    build:
      context: .
      target: itest
    profiles: [test]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3.5:9b-q4_K_M}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      NUM_CTX: ${NUM_CTX:-16384}
      THINK: ${THINK:-false}
      SEED: ${SEED:-42}
      TASK_MODE: ${TASK_MODE:-subagents}

volumes:
  ollama-models:
  yocode-data:
